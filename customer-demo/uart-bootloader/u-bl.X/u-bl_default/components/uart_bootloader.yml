configVersion: 1.0.0
componentName: uart_bootloader
coreVersion: 5.9.2
device: PIC32MX270F256D
library: []
dependency:
- dependencyPackage: class com.microchip.mcc.harmony.HarmonyModule
  name: uart_bootloader
  type: module
  version: ''
- dependencyPackage: ''
  name: bootloader
  type: package
  version: v3.9.0
customDataClassName: com.microchip.utils_mh3.utils.persistence.CustomModuleData
data:
  attachments:
    children:
    - children:
      - attributes:
          id: btl_MEMORY_dependency
        children:
        - children:
          - attributes:
              id: targetComponentID
            children:
            - type: Value
              value: nvm
            type: String
          - attributes:
              id: targetAttachmentID
            children:
            - type: Value
              value: NVM_MEMORY
            type: String
          type: Attributes
        type: DirectDependency
      - attributes:
          id: btl_TIMER_dependency
        children:
        - children:
          - attributes:
              id: targetComponentID
            children:
            - type: Value
              value: core_timer
            type: String
          - attributes:
              id: targetAttachmentID
            children:
            - type: Value
              value: CORE_TIMER_TMR
            type: String
          type: Attributes
        type: DirectDependency
      - attributes:
          id: btl_UART_dependency
        children:
        - children:
          - attributes:
              id: targetComponentID
            children:
            - type: Value
              value: uart2
            type: String
          - attributes:
              id: targetAttachmentID
            children:
            - type: Value
              value: UART2_UART
            type: String
          type: Attributes
        type: DirectDependency
      type: Attachments
    type: uart_bootloader
  elementPosition: {}
  symbols:
    BTL_APP_JUMP_ADDRESS:
      attributes:
        id: BTL_APP_JUMP_ADDRESS
        label: Application Jump Address
      children:
      - children:
        - attributes:
            id: uart_bootloader
            value: 1d008000
          type: Dynamic
        type: Values
      type: String
    BTL_DEVCFG_ADDRESS:
      attributes:
        id: BTL_DEVCFG_ADDRESS
        label: Device Configuration Address
      type: String
    BTL_DUAL_BANK:
      attributes:
        id: BTL_DUAL_BANK
        label: Use Dual Bank For Safe Flash Update
      type: Boolean
    BTL_FUSE_PROGRAM_ENABLE:
      attributes:
        id: BTL_FUSE_PROGRAM_ENABLE
        label: Enable Fuse Programming
      type: Boolean
    BTL_RAM_SIZE:
      attributes:
        id: BTL_RAM_SIZE
        label: BTL_RAM_SIZE
      type: String
    BTL_RAM_START:
      attributes:
        id: BTL_RAM_START
        label: BTL_RAM_START
      type: String
    BTL_SIZE:
      attributes:
        id: BTL_SIZE
        label: Bootloader Size (Bytes)
      children:
      - children:
        - attributes:
            id: uart_bootloader
            value: '4096'
          type: Dynamic
        - attributes:
            value: '32768'
          type: User
        type: Values
      type: String
    BTL_START:
      attributes:
        id: BTL_START
        label: Bootloader Start Address
      type: String
    BTL_TRIGGER_ENABLE:
      attributes:
        id: BTL_TRIGGER_ENABLE
        label: Enable Bootloader Trigger From Firmware
      type: Boolean
    BTL_TRIGGER_LEN:
      attributes:
        id: BTL_TRIGGER_LEN
        label: Number Of Bytes To Reserve From Start Of RAM
      type: String
    BTL_TYPE:
      attributes:
        id: BTL_TYPE
        label: Bootloader Type
      type: String
    BTL_WDOG_ENABLE:
      attributes:
        id: BTL_WDOG_ENABLE
        label: Enable Watchdog Refresh If Enabled Through FUSE
      type: Boolean
    MEM_USED:
      attributes:
        id: MEM_USED
        label: Bootloader NVM Memory Used
      children:
      - children:
        - attributes:
            id: uart_bootloader
            value: NVM
          type: Dynamic
        type: Values
      type: String
    PERIPH_USED:
      attributes:
        id: PERIPH_USED
        label: Bootloader Peripheral Used
      children:
      - children:
        - attributes:
            id: uart_bootloader
            value: UART2
          type: Dynamic
        type: Values
      type: String
  userData: {}
